name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Code-node tests (sender allow-list, reminders, delete, briefs)
        run: npm install && npm test
      - name: Publishing tools tests
        run: pip install pytest && pytest
      - name: Scan the repo for secrets and personal data
        run: python tools/scan.py .
